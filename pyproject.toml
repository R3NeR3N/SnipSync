[project]
name = "snipsync"
version = "1.0.0"
description = "Silent video auto-cutter & subtitle generator with NLE timeline export (Windows GUI)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Direct runtime dependencies only. The full pinned set lives in
# requirements.txt (treat as the generated lock; AGENTS.md §3). FFmpeg must be
# on PATH (external, not a Python dep).
dependencies = [
    "auto-editor>=29,<30",
    "faster-whisper>=1,<2",
    "customtkinter>=5,<6",
    "tkinterdnd2",
]

[project.optional-dependencies]
build = ["pyinstaller>=6,<7"]
dev = ["pytest>=7"]

[project.scripts]
snipsync = "app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
