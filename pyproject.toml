[project]
name = "snipsync"
version = "1.0.0"
description = "Silent video auto-cutter & subtitle generator with NLE timeline export (Windows GUI)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Direct runtime dependencies only. The full pinned set lives in
# requirements.txt (treat as the generated lock; AGENTS.md §3). FFmpeg must be
# on PATH (external, not a Python dep).
dependencies = [
    "auto-editor>=29,<30",
    "faster-whisper>=1,<2",
    "customtkinter>=5,<6",
    "tkinterdnd2",
]

[project.optional-dependencies]
build = ["pyinstaller>=6,<7"]
dev = ["pytest>=7", "ruff>=0.6"]
# Opt-in GPU (CUDA 12) acceleration for faster-whisper on Windows. These wheels
# ship cuBLAS/cuDNN/cudart DLLs *inside* the venv (site-packages/nvidia/*/bin) so
# the host stays clean. subtitles.add_cuda_dll_dirs() registers them at runtime.
# NOT bundled in the distributed EXE (CONTEXT §7); install with: pip install -e ".[gpu]"
gpu = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
    "nvidia-cuda-runtime-cu12",
]

[project.scripts]
snipsync = "app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Baseline ignores: stylistic rules deferred so the first green CI does not
# require reflowing the legacy app.py monolith. Tighten as the split lands
# (ARCHITECTURE §2). E501=line length, E701=compound stmt, B007=unused loop var.
ignore = ["E501", "E701", "B007"]
