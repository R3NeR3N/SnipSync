name: CI

# Quality gate for every push / PR.
# Heavy runtime deps (auto-editor / faster-whisper) are NOT installed: the test
# suite mocks subprocess and transcribe, so CI only needs customtkinter + pytest.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip ruff
      - run: ruff check .

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps (no heavy ASR/auto-editor stack)
        # numpy / budoux は軽量。VAD・音声組み立て・日本語改行のテストに必要。
        run: python -m pip install --upgrade pip pytest customtkinter numpy budoux defusedxml
      - name: Run tests
        run: python -m pytest -q
