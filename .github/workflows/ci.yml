name: CI

# Quality gate for every push / PR (AGENTS.md §4, dev workflow guide §4 三点セット).
# Heavy runtime deps (auto-editor / faster-whisper) are NOT installed: the test
# suite mocks subprocess and transcribe, so CI only needs customtkinter + pytest.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip ruff
      - run: ruff check .

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps (no heavy ASR/auto-editor stack)
        run: python -m pip install --upgrade pip pytest customtkinter
      - name: Run tests
        run: python -m pytest -q
